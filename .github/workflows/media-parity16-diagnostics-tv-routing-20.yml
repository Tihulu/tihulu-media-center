name: MEDIA-PARITY16-DIAGNOSTICS-AND-TV-ROUTING-20 exact-head CI
on:
  pull_request:
    branches: [security/media-sec09-parent-race-hardening-10-20261112]
  workflow_dispatch:
permissions:
  contents: read

jobs:
  source-preservation:
    name: Frozen source + 105 inherited source tests + PARITY16 guards
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Verify immutable baseline and run all inherited source suites
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
        run: |
          set -euo pipefail
          export PYTHONDONTWRITEBYTECODE=1 HF_HUB_OFFLINE=1 TRANSFORMERS_OFFLINE=1
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          BASE=2f5699eeb47505468bf3327be4dbdd89fed3dff1
          SNAPSHOT=7821769eb7aed576dd426ec18ffce3696d93a00d
          git merge-base --is-ancestor "$BASE" HEAD
          git diff --exit-code "$BASE" HEAD -- source/installed-package/ installer/preview_safety.py
          git diff --exit-code "$SNAPSHOT" HEAD -- source/installed-package/
          bash -n installer/media-stable-first.sh
          shellcheck installer/media-stable-first.sh
          /usr/bin/python3 -m py_compile tests/test_media_parity16_source_20.py tests/test_media_parity16_native_20.py
          /usr/bin/python3 -m unittest discover -s tests -p 'test_stable_first_*.py' -v
          /usr/bin/python3 -m unittest discover -s tests -p 'test_media_install_safety_p0.py' -v
          /usr/bin/python3 -m unittest discover -s tests -p 'test_media_ai_runtime_parity_05.py' -v
          /usr/bin/python3 -m unittest discover -s tests -p 'test_media_installer_p1_hardening_08.py' -v
          /usr/bin/python3 -m unittest discover -s tests -p 'test_media_sec09_parent_races_10.py' -v
          /usr/bin/python3 -m unittest discover -s tests -p 'test_media_parity16_source_20.py' -v
          bash installer/media-stable-first.sh --dry-run --no-ai
          echo "PASS: exact-head frozen-source boundary and all 105 inherited source regressions plus 3 PARITY16 tests"
          echo "HOLD: no RF, original owner binary, real AI inference or public release"

  baseline-reproduction:
    name: Independent PR11 native baseline with two expected parity failures
    runs-on: ubuntu-24.04
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install disposable Ubuntu native build dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git ca-certificates cmake g++ make pkg-config extra-cmake-modules \
            qtbase5-dev libqt5x11extras5-dev libkf5coreaddons-dev \
            libkf5dbusaddons-dev libkf5i18n-dev libkf5kio-dev \
            libkf5solid-dev libkf5widgetsaddons-dev libkf5windowsystem-dev \
            libkf5xmlgui-dev libvlc-dev libx11-dev libxss-dev libdvbv5-dev \
            libudev-dev libqt5sql5-sqlite vlc python3 python3-pyqt5 \
            ffmpeg mpv dvb-tools psmisc xvfb xauth dbus-x11
      - name: Build PR11 exactly and reproduce diagnostics + direct Python TV gaps
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          BASE=2f5699eeb47505468bf3327be4dbdd89fed3dff1
          basework="$RUNNER_TEMP/media-parity16-original-pr11"
          git worktree add --detach "$basework" "$BASE"
          test "$(git -C "$basework" rev-parse HEAD)" = "$BASE"
          export HOME="$RUNNER_TEMP/media-parity16-negative-owner"
          mkdir -p "$HOME"
          trap 'bash "$basework/installer/media-stable-first.sh" --uninstall || true' EXIT
          bash "$basework/installer/media-stable-first.sh" --install --no-ai
          app="$HOME/.local/opt/tihulu-media-stable"
          release="$(readlink "$app/current")"
          test -x "$release/native/bin/kaffeine"
          test -f "$release/py/kaffeine_next/dvb_diagnostics.sh"
          test ! -e "$app/preview-home/.local/share/tihulu-kaffeine/dvb_diagnostics.sh"
          grep -aFq '/.local/share/tihulu-kaffeine/dvb_diagnostics.sh' "$release/native/bin/kaffeine"
          echo "REPRODUCED PARITY16-01: PR11 compiled native menu points to missing script despite bundled module file"
          test ! -e "$app/preview-home/.local/bin/tihulu-kaffeine"
          set +e
          output="$(env HOME="$app/preview-home" TIHULU_MEDIA_OWNER_HOME="$HOME" \
                    PYTHONPATH="$release/py" PYTHONDONTWRITEBYTECODE=1 \
                    /usr/bin/python3 -m tv_center tv 2>&1)"
          rc="$?"
          set -e
          test "$rc" = 2
          [[ "$output" == *"Kaffeine core not installed"* ]]
          echo "REPRODUCED PARITY16-02: PR11 direct Python TV under isolated HOME exits 2; native TV wrapper remains separately supported"
          echo "Evidence type: disposable Ubuntu actual native install, no RF/model access"

  corrected-native-install:
    name: Two fixed native Ubuntu installs + 46 inherited installed tests + PARITY16
    needs: [source-preservation, baseline-reproduction]
    runs-on: ubuntu-24.04
    timeout-minutes: 100
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Install disposable Ubuntu native test dependencies
        run: |
          set -euo pipefail
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            git ca-certificates cmake g++ make pkg-config extra-cmake-modules \
            qtbase5-dev libqt5x11extras5-dev libkf5coreaddons-dev \
            libkf5dbusaddons-dev libkf5i18n-dev libkf5kio-dev \
            libkf5solid-dev libkf5widgetsaddons-dev libkf5windowsystem-dev \
            libkf5xmlgui-dev libvlc-dev libx11-dev libxss-dev libdvbv5-dev \
            libudev-dev libqt5sql5-sqlite vlc python3 python3-pyqt5 \
            ffmpeg mpv dvb-tools psmisc xvfb xauth dbus-x11
      - name: Install twice with real native GUI and synthetic TV/Radio/Lyrics, rollback and owned-only uninstall
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.event.pull_request.head.sha || github.sha }}
          HF_HUB_OFFLINE: "1"
          TRANSFORMERS_OFFLINE: "1"
          PYTHONDONTWRITEBYTECODE: "1"
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          export HOME="$RUNNER_TEMP/media-parity16-fixed-owner"
          export XDG_CONFIG_HOME="$HOME/.config"
          export XDG_DATA_HOME="$HOME/.local/share"
          export XDG_CACHE_HOME="$HOME/.cache"
          export XDG_STATE_HOME="$HOME/.local/state"
          mkdir -p "$HOME/.config/tihulu-tv-center" "$HOME/.config/TIHULU" \
                   "$HOME/.local/share/tihulu-tv-center" "$HOME/Recordings"
          printf 'ORIGINAL-PRIVATE-AI-CONTENT\n' > "$HOME/.config/tihulu-tv-center/ai-settings.json"
          printf 'ORIGINAL-PRIVATE-RADIO-CONTENT\n' > "$HOME/.config/TIHULU/KaffeineRadio.conf"
          printf 'ORIGINAL-PRIVATE-RECORDING-CONTENT\n' > "$HOME/Recordings/owner.wav"
          trap 'bash installer/media-stable-first.sh --uninstall || true' EXIT
          bash installer/media-stable-first.sh --check --no-ai
          for index in 1 2; do
            bash installer/media-stable-first.sh --install --no-ai
            app="$HOME/.local/opt/tihulu-media-stable"
            release="$(readlink "$app/current")"
            export TIHULU_MEDIA_QA_RELEASE="$release"
            dbus-run-session -- xvfb-run -a /usr/bin/python3 -m unittest discover \
                -s tests -p 'test_media_exact_runtime_acceptance.py' -v
            env HOME="$app/preview-home" XDG_CONFIG_HOME="$app/preview-home/.config" \
                XDG_DATA_HOME="$app/preview-home/.local/share" XDG_CACHE_HOME="$app/preview-home/.cache" \
                XDG_STATE_HOME="$app/preview-home/.local/state" \
                dbus-run-session -- xvfb-run -a /usr/bin/python3 -m unittest discover \
                -s tests -p 'test_media_tv_radio_exact_parity_04.py' -v
            dbus-run-session -- xvfb-run -a /usr/bin/python3 -m unittest discover \
                -s tests -p 'test_media_parity16_native_20.py' -v
            if [ "$index" = 1 ]; then first="$release"; else second="$release"; fi
            grep -Fxq ORIGINAL-PRIVATE-AI-CONTENT "$HOME/.config/tihulu-tv-center/ai-settings.json"
            grep -Fxq ORIGINAL-PRIVATE-RADIO-CONTENT "$HOME/.config/TIHULU/KaffeineRadio.conf"
            grep -Fxq ORIGINAL-PRIVATE-RECORDING-CONTENT "$HOME/Recordings/owner.wav"
          done
          test "$first" != "$second"
          test "$first" = "$(readlink "$app/previous")"
          bash installer/media-stable-first.sh --rollback
          test "$first" = "$(readlink "$app/current")"
          test "$second" = "$(readlink "$app/previous")"
          bash installer/media-stable-first.sh --uninstall
          bash installer/media-stable-first.sh --uninstall
          test ! -e "$first" && test ! -e "$second"
          test ! -L "$app/current"
          test ! -e "$HOME/.local/bin/tihulu-media-stable"
          test ! -e "$HOME/.local/bin/tihulu-kaffeine"
          test ! -e "$HOME/.local/share/applications/tihulu-media-stable.desktop"
          # Private preview HOME (including its isolated module-compat link) is preserved.
          test -L "$app/preview-home/.local/bin/tihulu-kaffeine"
          test -f "$app/.media-preview-owner-v1"
          grep -Fxq ORIGINAL-PRIVATE-AI-CONTENT "$HOME/.config/tihulu-tv-center/ai-settings.json"
          grep -Fxq ORIGINAL-PRIVATE-RADIO-CONTENT "$HOME/.config/TIHULU/KaffeineRadio.conf"
          grep -Fxq ORIGINAL-PRIVATE-RECORDING-CONTENT "$HOME/Recordings/owner.wav"
          echo "PASS: two real Ubuntu native builds, PARITY16 direct Python GUI, diagnostic script, inherited QA, rollback/uninstall"
          echo "HOLD: hardware, physical RF/Teletext, real Whisper/translation models, owner binary parity, security and license gates"
